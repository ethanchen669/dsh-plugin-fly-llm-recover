name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # 署名检查要走完整历史（默认 depth=1 会让它只看得到一笔 —— 等于把尺子遮住）
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # 署名闸门放在装依赖之前：它不需要任何依赖，也不该等到装完才发现署名不对。
      - run: node scripts/check-commit-identity.mjs --all
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
